<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — TCN Berth Plan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --surface:     #070a12;
            --panel:       #0e1320;
            --panel-2:     #131a2a;
            --border:      rgba(120,160,220,0.12);
            --accent:      #f0b429;      /* jaune conteneur */
            --accent-2:    #3fb6e8;      /* bleu maritime */
            --accent-3:    #e5533d;      /* rouge portuaire */
            --accent-glow: rgba(240,180,41,0.30);
            --text:        #e8edf5;
            --muted:       #5a6580;
            --muted-light: #8b96ad;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--surface);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            /* laisse la place au navire sous la carte */
            padding-bottom: clamp(120px, 24vh, 270px);
        }

        /* ── Scène portuaire de fond (SVG) ── */
        .port-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.7; }
        .port-bg svg { width: 100%; height: 100%; }

        /* ── Animations du navire et de la grue ── */
        .ship-sail { animation: sailIn 3.5s cubic-bezier(.22,1,.36,1) both; }
        .ship-bob  { animation: bob 6s ease-in-out 3.5s infinite; transform-box: fill-box; transform-origin: center bottom; }
        @keyframes sailIn { from { transform: translateX(560px); } to { transform: translateX(0); } }
        @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(3px) rotate(-0.35deg); } }
        .ship-reflection { animation: shimmer 4s ease-in-out infinite; }
        @keyframes shimmer { 0%,100% { opacity: .07; } 50% { opacity: .03; } }
        .smoke { animation: smoke 5s ease-in-out infinite; transform-box: fill-box; transform-origin: left bottom; }
        @keyframes smoke { 0%,100% { opacity: .22; transform: translate(0,0) scale(1); } 50% { opacity: .1; transform: translate(10px,-6px) scale(1.15); } }
        .foam { stroke-dasharray: 6 4; animation: foam 1.6s linear infinite; }
        @keyframes foam { to { stroke-dashoffset: -20; } }
        .beacon { animation: beacon 1.6s steps(2) infinite; }
        @keyframes beacon { 50% { opacity: 0.15; } }
        .radar { animation: radar 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
        @keyframes radar { 0% { transform: scaleX(1); } 50% { transform: scaleX(.2); } 100% { transform: scaleX(1); } }
        .waves line { stroke-dasharray: 40 18; animation: waves 7s linear infinite; }
        .waves line:nth-child(even) { animation-duration: 10s; animation-direction: reverse; }
        @keyframes waves { to { stroke-dashoffset: -116; } }
        .trolley { animation: trolley 12s ease-in-out infinite; }
        @keyframes trolley { 0%,15% { transform: translateX(0); } 45%,60% { transform: translateX(60px); } 90%,100% { transform: translateX(0); } }
        .hoist-box { animation: hoistBox 12s ease-in-out infinite; }
        @keyframes hoistBox { 0%,15% { transform: translateY(0); } 25%,50% { transform: translateY(-45px); } 60%,100% { transform: translateY(0); } }
        /* Navire centré en bas de l'écran, derrière la carte */
        .hero-ship {
            position: fixed; left: 50%; bottom: 2vh; transform: translateX(-50%);
            width: clamp(340px, 46vw, 760px); z-index: 1; pointer-events: none;
        }
        .hero-ship svg { width: 100%; height: auto; display: block; overflow: visible; }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

        /* Halo doré global */
        .bg-glow {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            opacity: 0.18; pointer-events: none; z-index: 0;
        }
        .bg-glow-1 { top: -220px; right: -160px; }
        .bg-glow-2 { bottom: -240px; left: -180px; opacity: 0.10;
                     background: radial-gradient(circle, rgba(63,182,232,0.6) 0%, transparent 70%); }

        /* Grain */
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        .login-wrapper {
            position: relative; z-index: 2; width: 100%; max-width: 440px; padding: 0 1.5rem;
            animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.3s both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }

        .login-card {
            background: linear-gradient(160deg, rgba(19,26,42,0.92), rgba(14,19,32,0.96));
            border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 2rem 2rem;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-3) 0%, var(--accent) 35%, var(--accent-2) 100%); opacity: 0.9;
        }

        .login-brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 1.75rem; }
        .brand-icon {
            width: 46px; height: 46px; background: linear-gradient(140deg, var(--accent), #d99a12);
            border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 8px 28px var(--accent-glow);
        }
        .brand-icon svg { width: 26px; height: 26px; fill: #070a12; }
        .brand-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.32rem; color: var(--text); letter-spacing: -0.025em; line-height: 1.15; }
        .brand-text span { color: var(--accent); }

        .login-title { text-align: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.25rem; color: var(--text); margin-bottom: 1.5rem; letter-spacing: -0.02em; }

        .alert-custom {
            background: rgba(229,83,61,0.10); border: 1px solid rgba(229,83,61,0.30); border-radius: 10px;
            padding: 0.75rem 1rem; font-size: 0.85rem; color: #f39a8c; margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 8px;
        }
        .alert-custom .btn-close { filter: invert(0.7); margin-left: auto; padding: 0; font-size: 0.7rem; }

        .input-group-custom { position: relative; margin-bottom: 1.25rem; }
        .input-group-custom .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--muted); font-size: 0.85rem; pointer-events: none; transition: color 0.2s; z-index: 2;
        }
        .input-group-custom input {
            width: 100%; background: rgba(255,255,255,0.035); border: 1px solid var(--border); border-radius: 10px;
            padding: 0.85rem 1rem 0.85rem 2.6rem; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-group-custom input::placeholder { color: var(--muted); }
        .input-group-custom input:focus { outline: none; border-color: var(--accent); background: rgba(240,180,41,0.05); box-shadow: 0 0 0 3px rgba(240,180,41,0.14); }
        .input-group-custom input:focus ~ .input-icon { color: var(--accent); }

        .login-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.82rem; }
        .form-check-input { background-color: transparent; border-color: var(--muted); }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        .form-check-label { color: var(--muted-light); font-size: 0.82rem; margin-left: 4px; }

        .btn-login {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            background: linear-gradient(135deg, var(--accent), #d99a12); color: #070a12;
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.88rem; letter-spacing: 0.05em;
            border: none; border-radius: 10px; padding: 0.88rem; cursor: pointer;
            transition: opacity 0.18s, box-shadow 0.18s, transform 0.18s;
        }
        .btn-login:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 10px 34px var(--accent-glow); color: #070a12; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .login-footer { text-align: center; margin-top: 1.5rem; font-size: 0.70rem; color: var(--muted); letter-spacing: 0.10em; text-transform: uppercase; }

        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem; }
            .brand-text { font-size: 1.12rem; }
            .port-bg { opacity: 0.4; }
            .hero-ship { width: 94vw; }
        }
    </style>
</head>

<!-- ─────────── Carte de connexion ─────────── -->
<div class="login-wrapper">
    <div class="login-card">

        <div class="login-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3c0 1.3.84 2.4 2 2.82V9H8v2h3v8.9A6 6 0 0 1 6.1 15H4.05A8 8 0 0 0 11 21.9V23h2v-1.1A8 8 0 0 0 19.95 15H17.9A6 6 0 0 1 13 19.9V11h3V9h-3V7.82A3 3 0 0 0 15 5a3 3 0 0 0-3-3zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
            </div>
            <div>
                <div class="brand-text">TCN <span>Berth</span> Plan</div>
            </div>
        </div>

        <h2 class="login-title">Connexion</h2>

        {% if messages %}
            {% for message in messages %}
            <div class="alert-custom" role="alert">
                <i class="fas fa-exclamation-triangle"></i>
                {{ message }}
                <button type="button" class="btn-close" aria-label="Fermer" onclick="this.parentElement.remove()"></button>
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" id="loginForm">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="input-group-custom">
                <input type="text" name="username" placeholder="Nom d'utilisateur" required autocomplete="username" aria-label="Nom d'utilisateur">
                <i class="fas fa-user input-icon"></i>
            </div>

            <div class="input-group-custom">
                <input type="password" name="password" placeholder="Mot de passe" required autocomplete="current-password" aria-label="Mot de passe">
                <i class="fas fa-lock input-icon"></i>
            </div>

            <div class="login-options">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me" value="1">
                    <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                </div>
            </div>

            <button type="submit" class="btn btn-login" id="loginBtn">
                <i class="fas fa-anchor"></i>
                SE CONNECTER
            </button>
        </form>

        <div class="login-footer">TCN Berth Plan &copy; 2026</div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function () {
        const btn = document.getElementById('loginBtn');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Connexion...';
        btn.disabled = true;
    });
</script>

</body>
</html>
